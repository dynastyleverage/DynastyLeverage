<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dynasty Leverage</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Dynasty trade calculator</p>
          <h1>Dynasty Leverage</h1>
        </div>
        <div class="hero-metrics">
          <span id="assetCount">-- assets</span>
          <span>SQLite backed</span>
        </div>
      </section>

      <section class="calculator">
        <div class="side" data-side="A">
          <div class="side-header">
            <h2>Side A</h2>
            <strong id="totalA">0</strong>
          </div>
          <div class="dropzone" id="sideA"></div>
        </div>

        <div class="result">
          <div class="score">
            <span id="diffLabel">Even</span>
            <strong id="difference">0</strong>
          </div>
          <p id="verdict">Add players or picks to compare.</p>
          <button id="clearButton" type="button">Clear trade</button>
        </div>

        <div class="side" data-side="B">
          <div class="side-header">
            <h2>Side B</h2>
            <strong id="totalB">0</strong>
          </div>
          <div class="dropzone" id="sideB"></div>
        </div>
      </section>

      <section class="market">
        <div class="market-toolbar">
          <input id="searchInput" type="search" placeholder="Search players, picks, teams, positions">
          <select id="positionFilter" aria-label="Position filter">
            <option value="ALL">All</option>
            <option value="QB">QB</option>
            <option value="RB">RB</option>
            <option value="WR">WR</option>
            <option value="TE">TE</option>
            <option value="PICK">Picks</option>
          </select>
        </div>
        <div class="asset-list" id="assetList"></div>
      </section>
    </main>

    <template id="assetTemplate">
      <article class="asset-card">
        <div>
          <h3></h3>
          <p></p>
        </div>
        <div class="asset-actions">
          <strong></strong>
          <button type="button" data-add="A">A</button>
          <button type="button" data-add="B">B</button>
        </div>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
